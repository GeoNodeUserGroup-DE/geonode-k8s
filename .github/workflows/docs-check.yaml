name: docs check
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  HELM_DOCS_VERSION: "1.14.2"

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repository
      uses: actions/checkout@v3
    - name: install helm-docs
      run: |
        curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
          | tar -xz -C /usr/local/bin helm-docs
    # charts/geonode/README.md is generated from Chart.yaml and the values.yaml annotations
    # and must never be edited by hand.
    - name: check chart README is up to date
      run: |
        helm-docs --chart-search-root=charts/geonode
        if ! git diff --exit-code charts/geonode/README.md; then
          echo "::error file=charts/geonode/README.md::charts/geonode/README.md is outdated. Run 'helm-docs --chart-search-root=charts/geonode' (v${HELM_DOCS_VERSION}) and commit the result."
          exit 1
        fi
    # docs/index.md is the readthedocs landing page and mirrors README.md, with links
    # rewritten to be relative to the docs/ directory.
    - name: check docs/index.md matches README.md
      run: |
        if ! sed 's#](docs/#](#g' README.md | diff -u docs/index.md -; then
          echo "::error file=docs/index.md::docs/index.md is out of sync with README.md. Run: sed 's#](docs/#](#g' README.md > docs/index.md"
          exit 1
        fi
