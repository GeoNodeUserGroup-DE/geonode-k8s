name: helm lint test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  helm-check:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repository
      uses: actions/checkout@v3
    - name: install helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0' # default is latest (stable)
    - name: build dependencies
      run: helm dependency update charts/geonode/
    # geonode.secret.django.secretKey is required() and intentionally has no default,
    # so a render needs a value supplied. It is a throwaway for the check only.
    - name: helm lint
      run: helm lint --strict charts/geonode/ --set geonode.secret.django.secretKey=ci-check-only
    - name: helm template
      run: helm template ci charts/geonode/ --set geonode.secret.django.secretKey=ci-check-only > /dev/null
