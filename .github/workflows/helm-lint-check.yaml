name: helm lint test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  helm-check:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repository
      uses: actions/checkout@v3
    - name: install helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0' # default is latest (stable)
    - name: build dependencies
      run: helm dependency update charts/geonode/
    # These values are required() and intentionally have no default, so a render
    # needs them supplied. They are throwaways for the check only.
    - name: helm lint
      run: |
        helm lint --strict charts/geonode/ \
          --set geonode.secret.django.secretKey=ci-check-only \
          --set geonode.secret.oauth2.clientId=ci-check-only \
          --set geonode.secret.oauth2.clientSecret=ci-check-only
    - name: helm template
      run: |
        helm template ci charts/geonode/ \
          --set geonode.secret.django.secretKey=ci-check-only \
          --set geonode.secret.oauth2.clientId=ci-check-only \
          --set geonode.secret.oauth2.clientSecret=ci-check-only > /dev/null
