{{- if empty .Values.geonode.secret.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "geonode_secret_name" . }}"
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # superuser credentials
  ADMIN_USERNAME: {{ .Values.geonode.secret.superUser.username | b64enc }}
  ADMIN_PASSWORD: {{ .Values.geonode.secret.superUser.password | b64enc }}
  ADMIN_EMAIL: {{ .Values.geonode.secret.superUser.email | b64enc }}

  # mail secrets
  DJANGO_EMAIL_HOST_USER: {{ .Values.geonode.secret.mail.user | b64enc }}
  DJANGO_EMAIL_HOST_PASSWORD: {{ .Values.geonode.secret.mail.password | b64enc }}
  DEFAULT_FROM_EMAIL: {{ .Values.geonode.secret.mail.from | b64enc }}

  # OAuth2
  OAUTH2_API_KEY: {{ .Values.geonode.secret.oauth2.apiKey | b64enc | quote }}
  OAUTH2_CLIENT_ID: {{ required "geonode.secret.oauth2.clientId is required: generate a client id unique to this deployment. The chart no longer defaults to GeoNode's published sample credential." .Values.geonode.secret.oauth2.clientId | b64enc }}
  OAUTH2_CLIENT_SECRET: {{ required "geonode.secret.oauth2.clientSecret is required: generate a client secret unique to this deployment. The chart no longer defaults to GeoNode's published sample credential." .Values.geonode.secret.oauth2.clientSecret | b64enc }}
  SECRET_KEY: {{ required "geonode.secret.django.secretKey is required: set a value unique to this deployment, or point geonode.secret.existingSecretName at a Secret you manage." .Values.geonode.secret.django.secretKey | b64enc }}
  BING_API_KEY: {{ .Values.geonode.secret.bing.apiKey | b64enc | quote }}
{{ end }}